<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
{{STYLE}}
</style>
<meta name="color-scheme" content="light dark">
<script>(function(){var m=false,t=null;try{m=matchMedia("(prefers-color-scheme: dark)").matches}catch(e){}
try{t=new URLSearchParams(location.search).get("theme")}catch(e){}
document.documentElement.setAttribute("data-theme",(t==="light"||t==="dark")?t:(m?"dark":"light"))})();</script>
<title>{{CODE}} Sources — {{SITE_TITLE}}</title>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light and dark mode"><span id="themeIco">🌙</span><span id="themeLbl">Dark</span></button>
<div class="wrap">
<header>
  <div class="crumb"><a href="../">← {{TITLE}} · all units</a></div>
  <div class="eyebrow">{{CODE}} · Source register</div>
  <h1>Sources</h1>
  <p class="sub">These are the materials the notes were built from.</p>
</header>

{{SOURCES}}

<footer>Faculty PDFs open and download from GitHub. Textbooks are cited only; use your own copy.</footer>
</div>
<script>
(function(){var r=document.documentElement,b=document.getElementById("themeToggle"),i=document.getElementById("themeIco"),l=document.getElementById("themeLbl");
 function paint(){var d=r.getAttribute("data-theme")==="dark";i.textContent=d?"☀️":"🌙";l.textContent=d?"Light":"Dark";b.setAttribute("aria-pressed",d)}
 b.addEventListener("click",function(){r.setAttribute("data-theme",r.getAttribute("data-theme")==="dark"?"light":"dark");paint()});paint()})();
{{THEME_LINKS}}
</script>
{{ANALYTICS}}
</body>
</html>
